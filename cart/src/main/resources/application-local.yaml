server:
  port: 8083

product:
  service:
    url: http://localhost:8081/api/v1/products

spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/cart_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

