server:
  port: 8080

product:
  service:
    url: http://product-service:8080/api/v1/products

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/cart_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect