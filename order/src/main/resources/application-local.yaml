server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://localhost:5436/order_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres

  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

